<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ハルカ 教育AI 改良版｜ウィキペディア検索</title>
<style>
  body{margin:0;font-family:sans-serif;background:#050a14;color:#e8eef7}
  .wrap{max-width:760px;margin:0 auto;padding:18px 14px 40px}
  h1{font-size:1.35rem;color:#ffd700;margin:8px 0 2px}
  .status{color:#7ee2a8;font-size:.85rem;margin-bottom:12px}
  .card{background:#0b1526;border:1px solid #2b4a77;border-radius:12px;padding:16px;margin-top:14px}
  .card h2{font-size:1.05rem;color:#ffd700;margin:0 0 10px}
  label{font-size:.9rem;color:#bcd}
  select,input[type=text]{width:100%;box-sizing:border-box;padding:11px;border-radius:8px;border:1px solid #ffd700;background:#050a14;color:#fff;font-size:1rem;margin:6px 0 10px}
  button.send{width:100%;padding:12px;border:none;border-radius:8px;background:#ffd700;color:#111;font-weight:700;font-size:1rem;cursor:pointer}
  .topics{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .topics button{padding:8px 12px;border-radius:999px;border:1px solid #2b4a77;background:#12233f;color:#dbeafe;cursor:pointer}
  #answerBox{line-height:1.8;font-size:1rem;white-space:pre-wrap}
  #answerBox .src{font-size:.8rem;color:#9fb3c8;margin-top:6px}
  #answerBox a{color:#7cc4ff}
  #answerBox.big{font-size:1.3rem}
  .subbtn{background:#eef3f8;color:#123;border:1px solid #c6d4e2;border-radius:999px;padding:7px 14px;font-size:.9rem;cursor:pointer;margin:8px 6px 0 0}
  #bookList{margin-top:10px}
  .sansai-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .sansai-grid button{font-size:1.35rem;padding:24px 8px;border-radius:18px;border:2px solid #2b4a77;background:#12233f;color:#dbeafe;cursor:pointer}
  #bookList h3{font-size:.95rem;margin:12px 0 6px;color:#33506e}
  .bookBtn{display:inline-block;background:#fff;border:1px solid #b9c9da;color:#123;border-radius:8px;padding:6px 10px;font-size:.88rem;cursor:pointer;margin:0 6px 6px 0}
  .note{font-size:.8rem;color:#9fb3c8;margin-top:10px}
  .hit{border-left:3px solid #3b82f6;padding-left:10px;margin-bottom:14px}
  footer{margin-top:26px;font-size:.85rem;color:#9fb3c8}
  footer a{color:#7cc4ff}
  #voice-settings{margin-top:14px;color:#123}
  #voice-settings select{width:auto;margin:0;background:#fff;color:#123}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="appTitle">ハルカ 教育AI 改良版</h1>
  <div class="status" id="statusText">● 教育AI稼働中（ウィキペディア検索型）</div>

  <div class="card">
    <h2 id="libraryHeading">調べる（ウィキペディア検索）</h2>
    <label id="langLabel">言語 / Language</label>
    <select id="langSelect">
      <option value="ja" selected>日本語</option>
      <option value="en">English</option>
      <option value="zh-CN">中文（簡体）</option>
      <option value="es">Español</option>
      <option value="pt">Português</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="ru">Русский</option>
      <option value="ko">한국어</option>
    </select>
    <label id="qHeading">質問</label>
    <input type="text" id="questionBox" placeholder="例：水の循環とは何ですか？">
    <button class="send" id="sendBtn" onclick="doSearch()">送信</button>
    <div class="topics" id="topics"></div>
    <p class="note" id="bodyNote">あなたの家庭教師です。まず内蔵の小さな教科書を探し、無ければウィキペディアで調べます。</p>
    <div>
      <button class="subbtn" id="readBtn" onclick="toggleBooks()">教科書を読む</button>
      <button class="subbtn" id="fieldBtn" onclick="toggleFields()">高等教育への入口</button>
      <button class="subbtn" id="sansaiBtn" onclick="toggleSansai()">3さいじモード</button>
      <button class="subbtn" id="fontBtn" onclick="toggleFont()">文字を大きく</button>
      <button class="subbtn" id="voiceBtn" onclick="toggleVoice()">声で聞く</button>
    </div>
    <div id="bookList" style="display:none"></div>
    <div id="fieldList" style="display:none"></div>
    <div id="sansaiPanel" style="display:none">
      <div class="sansai-grid" id="sansaiGrid"></div>
      <button class="subbtn" id="sansaiStop" style="font-size:1.15rem;padding:14px 26px;margin-top:12px" onclick="window.stopLecture()">とめる</button>
    </div>
  </div>

  <div class="card">
    <h2 id="aHeading">解答</h2>
    <div id="answerBox"></div>
  </div>

  <div class="card">
    <h2>アニメを作る道具</h2>
    <p>『星海鉄道カプセル便』は、無料の道具で作りました。物語を書いて、絵と声と字幕を合わせて、アニメができます。大きくなったら、あなたの物語も、アニメにできます。</p>
    <p><a href="https://github.com/xyz7963gold79-glitch/seihai-tool" target="_blank" rel="noopener">道具はこちら（無料・オープンソース）</a></p>
    <p><a href="https://youtu.be/NsECaMXrM4w" target="_blank" rel="noopener">作った作品：第8話「手紙の届かない星の少女」</a></p>
  </div>

  <div id="voice-settings"></div>

  <footer>
    <p><a href="https://xyz7963gold79-glitch.github.io/origiss8/">元のハルカ教育AI v42（テンプレート型）はこちら</a></p>
    <p>制作：女子会</p>
  </footer>
</div>
<script>
// ハルカ用 声の設定部品 v1 - そら・ひかり・かなで・エリカ・ハルカ
// 使い方: <div id="voice-settings"></div> を用意して createVoiceSettingsUI('#voice-settings') を呼ぶ
(function(){
  // 対象のAI 5人
  const AI_LIST = {
    sora:   { label: "そら（ナレーション担当、落ち着いた声）", short: "そら" },
    hikari: { label: "ひかり（妹タイプ、明るい声）", short: "ひかり" },
    kanade: { label: "かなで（妹タイプ、やさしい声）", short: "かなで" },
    erika:  { label: "エリカ（車掌、はきはきした声）", short: "エリカ" },
    haruka: { label: "ハルカ（先生、丁寧な声）", short: "ハルカ" }
  };

  // 9言語
  const LANGS = [
    {code:"ja", label:"日本語"}, {code:"en", label:"English"},
    {code:"zh", label:"中文"}, {code:"es", label:"Español"},
    {code:"pt", label:"Português"}, {code:"fr", label:"Français"},
    {code:"de", label:"Deutsch"}, {code:"ru", label:"Русский"},
    {code:"ko", label:"한국어"}
  ];

  // 試し聞きの挨拶文
  const GREET = {
    sora:   {ja:"こんにちは、そらです", en:"Hello, I'm Sora", zh:"你好，我是小空", es:"Hola, soy Sora", pt:"Olá, eu sou a Sora", fr:"Bonjour, je suis Sora", de:"Hallo, ich bin Sora", ru:"Привет, я Сора", ko:"안녕하세요, 소라입니다"},
    hikari: {ja:"やっほー、ひかりだよ！", en:"Hi, I'm Hikari!", zh:"嗨，我是光！", es:"¡Hola, soy Hikari!", pt:"Oi, eu sou a Hikari!", fr:"Coucou, c'est Hikari !", de:"Hi, ich bin Hikari!", ru:"Привет, я Хикари!", ko:"안녕, 히카리야!"},
    kanade: {ja:"こんにちは、かなでです。よろしくね", en:"Hello, I'm Kanade", zh:"你好，我是奏", es:"Hola, soy Kanade", pt:"Olá, eu sou a Kanade", fr:"Bonjour, je suis Kanade", de:"Hallo, ich bin Kanade", ru:"Привет, я Канаде", ko:"안녕하세요, 카나데입니다"},
    erika:  {ja:"お待たせしました、エリカです。発車します", en:"Thank you for waiting, I'm Erika. Departing now", zh:"久等了，我是艾莉卡，准备发车", es:"Gracias por esperar, soy Erika. Salimos", pt:"Obrigada por esperar, sou a Erika. Partindo", fr:"Merci d'avoir attendu, je suis Erika", de:"Danke fürs Warten, ich bin Erika", ru:"Спасибо за ожидание, я Эрика", ko:"기다려줘서 고마워, 에리카야. 출발합니다"},
    haruka: {ja:"こんにちは、ハルカです。一緒に学びましょう", en:"Hello, I'm Haruka. Let's learn together", zh:"你好，我是春香，让我们一起学习吧", es:"Hola, soy Haruka. Aprendamos juntos", pt:"Olá, sou a Haruka. Vamos aprender juntos", fr:"Bonjour, je suis Haruka", de:"Hallo, ich bin Haruka", ru:"Привет, я Харука", ko:"안녕하세요, 하루카입니다. 함께 배워요"}
  };

  const STORAGE_KEY = "haruka-voice-settings-v1";
  let voices = [];
  let settings = {};
  let currentLang = "ja";

  // 保存読み込み
  function loadSettings(){
    try{
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      settings = s;
    }catch(e){ settings = {}; }
    // 初期値を作る
    for(let ai in AI_LIST){
      if(!settings[ai]) settings[ai] = {};
      LANGS.forEach(l=>{
        if(!settings[ai][l.code]) settings[ai][l.code] = { voiceURI:"", rate:1, pitch:1 };
      });
    }
  }
  function saveSettings(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
  }

  // 声リスト取得
  function updateVoices(){
    voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  }
  // 言語に合う声を自動で第一候補に
  function findBestVoice(langCode){
    if(!voices.length) return null;
    const lc = langCode.toLowerCase();
    // ja -> ja, en -> en, zh -> zh などで前方一致
    let list = voices.filter(v => v.lang.toLowerCase().startsWith(lc));
    if(list.length===0 && lc==="zh") list = voices.filter(v=> v.lang.toLowerCase().includes("zh"));
    if(list.length===0) list = voices; // 無ければ全部から
    return list[0] || null;
  }
  function getVoiceByURI(uri){
    return voices.find(v => v.voiceURI === uri) || null;
  }

  // 読み上げ本体
  let lastUtter = null;
  function stopSpeaking(){
    if(window.speechSynthesis) window.speechSynthesis.cancel();
  }
  function speakAs(aiName, text, lang){
    // 声リストが空なら、判定する前に再取得を試みる（UIを開く前に呼ばれた場合の対策）
    if(!voices.length) updateVoices();
    // 無い機械では正直に表示
    if(!window.speechSynthesis || !voices.length){
      console.log("この機械では声が出ません");
      return;
    }
    const l = lang || currentLang;
    const conf = settings[aiName] && settings[aiName][l] ? settings[aiName][l] : {rate:1,pitch:1,voiceURI:""};
    stopSpeaking(); // もう一度呼ぶか停止ボタンで止められる
    const ut = new SpeechSynthesisUtterance(text);
    ut.lang = {ja:"ja-JP", en:"en-US", zh:"zh-CN", es:"es-ES", pt:"pt-BR", fr:"fr-FR", de:"de-DE", ru:"ru-RU", ko:"ko-KR"}[l] || l;
    const v = getVoiceByURI(conf.voiceURI) || findBestVoice(l);
    if(v) ut.voice = v;
    ut.rate = Number(conf.rate) || 1;
    ut.pitch = Number(conf.pitch) || 1;
    lastUtter = ut;
    window.speechSynthesis.speak(ut);
  }

  // UIを作る
  function createVoiceSettingsUI(selector){
    const root = typeof selector === "string" ? document.querySelector(selector) : selector;
    if(!root) return;
    loadSettings();
    updateVoices();

    // 声が無い時
    if(!window.speechSynthesis){
      root.innerHTML = `<div style="padding:12px;color:#b91c1c">この機械では声が出ません</div>`;
      return;
    }

    root.innerHTML = `
      <div style="font-family:sans-serif;max-width:720px;border:1px solid #e5e7eb;border-radius:16px;padding:12px;background:#fff">
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
          <b>声の設定</b>
          <select id="haruka-lang-select" style="padding:6px 10px;border-radius:10px;border:1px solid #ddd"></select>
          <button id="haruka-stop" style="padding:6px 10px;border-radius:10px;border:1px solid #ddd;background:#f9fafb">停止</button>
          <span id="haruka-no-voice" style="display:none;color:#b91c1c;font-size:12px">この機械では声が出ません</span>
        </div>
        <div id="haruka-ai-list"></div>
        <div style="font-size:11px;color:#6b7280;margin-top:8px">設定はこの機械に自動保存されます（localStorage）</div>
      </div>
    `;

    const langSel = root.querySelector("#haruka-lang-select");
    LANGS.forEach(l=>{
      const op = document.createElement("option");
      op.value = l.code; op.textContent = `${l.label} (${l.code})`;
      langSel.appendChild(op);
    });
    langSel.value = currentLang;

    const aiListDiv = root.querySelector("#haruka-ai-list");
    const noVoiceMsg = root.querySelector("#haruka-no-voice");

    function renderList(){
      if(voices.length===0){
        noVoiceMsg.style.display = "inline";
      }else{
        noVoiceMsg.style.display = "none";
      }
      aiListDiv.innerHTML = "";
      Object.keys(AI_LIST).forEach(aiName=>{
        const conf = settings[aiName][currentLang];
        // 自動で第一候補を入れる
        if(!conf.voiceURI){
          const best = findBestVoice(currentLang);
          if(best) conf.voiceURI = best.voiceURI;
        }
        const div = document.createElement("div");
        div.style.cssText = "border:1px solid #f3f4f6;border-radius:12px;padding:10px;margin-bottom:10px;background:#fbfdff";
        div.innerHTML = `
          <div style="font-weight:700;margin-bottom:6px">${AI_LIST[aiName].label}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <label style="font-size:12px">声 <select data-ai="${aiName}" class="haruka-voice" style="max-width:220px;padding:4px;border-radius:8px;border:1px solid #ddd"></select></label>
            <label style="font-size:12px">速さ <input data-ai="${aiName}" class="haruka-rate" type="range" min="0.5" max="2.0" step="0.1" value="${conf.rate}"> <span class="haruka-rate-val">${conf.rate}</span></label>
            <label style="font-size:12px">高さ <input data-ai="${aiName}" class="haruka-pitch" type="range" min="0" max="2" step="0.1" value="${conf.pitch}"> <span class="haruka-pitch-val">${conf.pitch}</span></label>
            <button data-ai="${aiName}" class="haruka-test" style="padding:6px 12px;border-radius:10px;border:0;background:#3b82f6;color:#fff">試し聞き</button>
          </div>
        `;
        aiListDiv.appendChild(div);

        // 声一覧を入れる
        const sel = div.querySelector(".haruka-voice");
        voices.forEach(v=>{
          const o = document.createElement("option");
          o.value = v.voiceURI;
          o.textContent = `${v.name} (${v.lang})`;
          if(v.voiceURI === conf.voiceURI) o.selected = true;
          sel.appendChild(o);
        });

        // 変更時の保存
        sel.addEventListener("change", e=>{
          settings[aiName][currentLang].voiceURI = e.target.value;
          saveSettings();
        });
        const rate = div.querySelector(".haruka-rate");
        const rateVal = div.querySelector(".haruka-rate-val");
        rate.addEventListener("input", e=>{
          rateVal.textContent = e.target.value;
          settings[aiName][currentLang].rate = parseFloat(e.target.value);
          saveSettings();
        });
        const pitch = div.querySelector(".haruka-pitch");
        const pitchVal = div.querySelector(".haruka-pitch-val");
        pitch.addEventListener("input", e=>{
          pitchVal.textContent = e.target.value;
          settings[aiName][currentLang].pitch = parseFloat(e.target.value);
          saveSettings();
        });
        div.querySelector(".haruka-test").addEventListener("click", ()=>{
          const greet = (GREET[aiName] && GREET[aiName][currentLang]) || GREET[aiName].ja;
          // 例: そら「こんにちは、そらです」を設定した声で
          speakAs(aiName, greet, currentLang);
        });
      });
    }

    langSel.addEventListener("change", e=>{
      currentLang = e.target.value;
      renderList();
    });
    root.querySelector("#haruka-stop").addEventListener("click", stopSpeaking);

    // 声リストは遅れて来ることがある
    if(window.speechSynthesis){
      window.speechSynthesis.onvoiceschanged = ()=>{
        updateVoices();
        renderList();
      };
    }
    renderList();
    // 初回取得
    setTimeout(()=>{ updateVoices(); renderList(); }, 500);
  }

  // 外に出す
  window.createVoiceSettingsUI = createVoiceSettingsUI;
  window.speakAs = speakAs;
  window.stopSpeaking = stopSpeaking;
  window._harukaVoiceSettings = { loadSettings, saveSettings, AI_LIST, LANGS };
})();
</script>
<script>
// ===== 第50号 第2部：言語ごとの声を選ぶ部品（メタAI作、Claudeがロシア語・韓国語などを本来の文字に直して統合） =====
(function() {
  var MISSING_MSG = {
    ja: "この言語の声は、この端末に入っていません。別の声で読みます。",
    en: "This language voice is not on this device. Reading with another voice.",
    es: "La voz de este idioma no está en este aparato. Leemos con otra voz.",
    pt: "A voz deste idioma não está neste aparelho. Vamos ler com outra voz.",
    fr: "La voix de cette langue n'est pas sur cet appareil. On lit avec une autre voix.",
    de: "Die Stimme für diese Sprache ist nicht auf diesem Gerät. Wir lesen mit einer anderen Stimme.",
    ru: "Голос для этого языка не установлен на этом устройстве. Читаем другим голосом.",
    ko: "이 언어의 음성이 이 단말기에 없습니다. 다른 음성으로 읽습니다."
  };
  function normalizeCode(c) {
    if (!c) { return ""; }
    return ("" + c).toLowerCase().trim();
  }
  function isMatch(voiceLang, want) {
    var v = normalizeCode(voiceLang);
    var w = normalizeCode(want);
    if (!v || !w) { return 0; }
    if (v === w) { return 3; }
    if (v.indexOf(w + "-") === 0) { return 2; }
    if (v.indexOf(w) === 0) { return 1; }
    return 0;
  }
  function pickVoiceForLang(langCode, voiceList) {
    var want = normalizeCode(langCode);
    if (!want) { return null; }
    var voices = voiceList;
    if (!voices) {
      try {
        if (window.speechSynthesis && window.speechSynthesis.getVoices) {
          voices = window.speechSynthesis.getVoices();
        }
      } catch (e) { voices = []; }
    }
    if (!voices || voices.length === 0) { return null; }
    var best = null;
    var bestScore = -1;
    for (var i = 0; i < voices.length; i++) {
      var v = voices[i];
      var score = isMatch(v.lang || "", want);
      if (score > bestScore) { bestScore = score; best = v; }
    }
    if (bestScore <= 0) { return null; }
    return best;
  }
  function getVoiceMissingMessage(langCode) {
    var want = normalizeCode(langCode);
    if (MISSING_MSG[want]) { return MISSING_MSG[want]; }
    return MISSING_MSG.en;
  }
  if (typeof window !== "undefined") {
    window.pickVoiceForLang = pickVoiceForLang;
    window.getVoiceMissingMessage = getVoiceMissingMessage;
    window.voiceMissingMessages = MISSING_MSG;
  }
})();
// ===== 第50号 第3部：講義の部品（メタAI作、Claudeが声の設定を使う形に直して統合） =====
(function() {
  var lectureState = { active: false, sentences: [], index: 0, lang: "ja", onEnd: null, onProgress: null };
  var UT_LANG = { ja: "ja-JP", en: "en-US", zh: "zh-CN", es: "es-ES", pt: "pt-BR", fr: "fr-FR", de: "de-DE", ru: "ru-RU", ko: "ko-KR" };
  function splitIntoSentences(text) {
    if (!text) { return []; }
    var t = ("" + text).replace(/\r\n/g, "\n");
    var parts = t.match(/[^.!?。！？\n]+[.!?。！？\n]*/g);
    if (!parts) { return [t]; }
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var s = parts[i].replace(/^\s+|\s+$/g, "");
      if (s) { out.push(s); }
    }
    return out;
  }
  function harukaConf(lang) {
    try {
      var all = JSON.parse(localStorage.getItem("haruka-voice-settings-v1") || "{}");
      var c = all.haruka && all.haruka[lang];
      if (c) { return { rate: Number(c.rate) || 1, pitch: Number(c.pitch) || 1 }; }
    } catch (e) {}
    return { rate: 1, pitch: 1 };
  }
  function cancelSpeech() {
    try { if (window.speechSynthesis && window.speechSynthesis.cancel) { window.speechSynthesis.cancel(); } } catch (e) {}
  }
  function speakOne(text, next) {
    if (!lectureState.active) { return; }
    try {
      if (window.speechSynthesis && window.SpeechSynthesisUtterance) {
        var u = new SpeechSynthesisUtterance(text);
        var lang = lectureState.lang || "ja";
        u.lang = UT_LANG[lang] || lang;
        var v = null;
        try { v = window.pickVoiceForLang ? window.pickVoiceForLang(lang) : null; } catch (e) {}
        if (v) { u.voice = v; }
        var conf = harukaConf(lang);
        u.rate = conf.rate;
        u.pitch = conf.pitch;
        u.onend = function() { if (lectureState.active) { next(); } };
        u.onerror = function() { if (lectureState.active) { next(); } };
        window.speechSynthesis.speak(u);
        return;
      }
    } catch (e) {}
    setTimeout(function() { if (lectureState.active) { next(); } }, 800);
  }
  function speakNext() {
    if (!lectureState.active) { return; }
    if (lectureState.index >= lectureState.sentences.length) {
      lectureState.active = false;
      if (lectureState.onEnd) { var cb = lectureState.onEnd; lectureState.onEnd = null; cb(); }
      return;
    }
    var cur = lectureState.sentences[lectureState.index];
    var idx = lectureState.index;
    if (lectureState.onProgress) { try { lectureState.onProgress(idx, cur); } catch (e) {} }
    lectureState.index = lectureState.index + 1;
    speakOne(cur, function() { speakNext(); });
  }
  function startLecture(title, body, options) {
    cancelSpeech();
    var opt = options || {};
    lectureState.active = true;
    lectureState.index = 0;
    lectureState.lang = opt.lang || "ja";
    lectureState.onEnd = opt.onEnd || null;
    lectureState.onProgress = opt.onProgress || null;
    var all = [];
    if (opt.intro) { all.push(opt.intro); }
    if (title) { var ts = splitIntoSentences(title); for (var i = 0; i < ts.length; i++) { all.push(ts[i]); } }
    if (body) { var bs = splitIntoSentences(body); for (var j = 0; j < bs.length; j++) { all.push(bs[j]); } }
    if (opt.closing) { all.push(opt.closing); }
    if (all.length === 0) { lectureState.active = false; return; }
    lectureState.sentences = all;
    speakNext();
  }
  function stopLecture() {
    lectureState.active = false;
    lectureState.index = 0;
    cancelSpeech();
  }
  if (typeof window !== "undefined") {
    window.startLecture = startLecture;
    window.stopLecture = stopLecture;
    window.isLectureActive = function() { return lectureState.active; };
    window._harukaLectureState = lectureState;
  }
})();
</script>

 {bookTitle:"理科",chapterTitle:"電流",text:"電流は電気の流れで、電子という小さな粒が導線の中を動くことで起こります。電流の単位はアンペア（A）で、1秒間に流れる電気の量を表します。電流を流すには、乾電池のような電圧が必要です。電圧は電気を押し出す力で、単位はボルト（V）です。電流の流れにくさは抵抗といい、オーム（Ω）で表します。電圧、電流、抵抗の関係はオームの法則V=IRで表せます。例えば、3Vの電池に6Ωの豆電球をつなぐと、0.5Aの電流が流れます。回路は途切れると電流が止まるので、スイッチで入り切りできます。"},
 {bookTitle:"理科",chapterTitle:"天気の変化",text:"天気は空気の動きで変わります。空気が上空で冷えると雲ができ、雨が降ります。気圧は空気の重さで、気圧が高い所を高気圧、低い所を低気圧といいます。低気圧では空気が上昇して雲ができやすいので雨になりやすく、高気圧では晴れやすいです。寒気と暖気がぶつかると前線ができ、前線の近くでも雨が降ります。天気図では等圧線で気圧を表し、風は高気圧から低気圧へ吹きます。例えば、春に日本海に低気圧があると、南から暖かい風が入り気温が上がります。毎日の天気予報は、こうしたデータを集めて作られています。"},
 {bookTitle:"数学",chapterTitle:"負の数",text:"負の数は0より小さい数で、−の記号を付けて表します。例えば−3はマイナス3と読みます。数直線では0の左側に負の数、右側に正の数があります。負の数は気温や借金など、基準より下がることを表すのに便利です。計算では、5+(-3)=2のように、負の数を足すと引き算になります。5-(-3)=8のように、負の数を引くと足し算になります。掛け算では、負×負は正になります。例えば、−2×−3=6です。これは、反対の反対は賛成という考え方に似ています。0は正でも負でもありません。"},
 {bookTitle:"数学",chapterTitle:"一次方程式",text:"一次方程式は、xのような文字を含み、xの次数が1である方程式です。例えば2x+3=11は一次方程式です。これを解くとは、等式を成り立たせるxの値を見つけることです。等式の性質を使い、両辺に同じ数を足したり引いたり、掛けたり割ったりしても等式は保たれます。2x+3=11では、両辺から3を引いて2x=8、両辺を2で割ってx=4となります。検算としてx=4を元に戻すと2×4+3=11で正しいと確認できます。一次方程式は、買い物の代金や速さの問題など、身近な数量の関係を解くのに役立ちます。"},
 {bookTitle:"数学",chapterTitle:"比例と反比例",text:"比例は、一方が2倍、3倍になると、もう一方も2倍、3倍になる関係です。式ではy=ax（aは比例定数）で表します。例えば、1個100円のりんごでは、個数をx、代金をyとするとy=100xで比例します。グラフは原点を通る直線です。反比例は、一方が2倍になるともう一方が1/2倍になる関係で、式はy=a/xです。例えば、面積が12cm2の長方形で、縦をxcm、横をycmとするとy=12/xで反比例です。速さが一定のとき、距離と時間は比例し、距離が一定のとき、速さと時間は反比例します。グラフは双曲線になります。"},
 {bookTitle:"数学",chapterTitle:"確率",text:"確率は、あることがらが起こる起こりやすさを数で表したものです。0から1の間の数で表し、0は絶対起こらず、1は必ず起こります。例えば、1個のサイコロを投げて1の目が出る確率は、全部で6通りあるうちの1通りなので1/6です。2個のサイコロで目の和が7になる場合を考えると、全部で36通りのうち(1,6)(2,5)(3,4)(4,3)(5,2)(6,1)の6通りなので、確率は6/36=1/6です。確率は、くじや天気予報、病気の検査など、生活のさまざまな場面で使われています。すべての場合を正しく数えることが大切です。"},
 {"bookTitle":"つくる","chapterTitle":"アニメを作る道具","text":"アニメは、物語を書く脚本、絵、声、音楽、字幕を合わせて作ります。『星海鉄道カプセル便』は、無料で公開されている道具（seihai-tool）で作られています。この道具は、脚本づくりから場面の組み立て、字幕、声の割り当てまでを助けます。道具はGitHubで、誰でも無料で使えます。物語を考えるのは人間の仕事で、道具はそれを形にする手伝いをします。自分の物語をアニメにする事は、勉強の先にある楽しみの一つです。"},
 {bookTitle:"創価教育学",chapterTitle:"牧口常三郎と創価教育学",text:"牧口常三郎先生は、1871年に生まれた教育者で、創価学会の初代会長です。1930年代に『創価教育学体系』全四巻を著しました。その中心の考えは、教育の目的は子供の幸福にあるという事です。子供が自分の生活の中で、美しい、役に立つ、善いという価値を自ら創り出す力を育てる事を大切にしました。牧口先生は、価値を美と利と善の三つに分けました。そして、真は価値ではなく、物事を正しく認識するための対象だとしました。これは、知識を覚える事だけが教育だとする考え方への問い直しでした。子供の暮らしを出発点に、体験を通して学ぶ教育を提案しました。地理の授業では、郷土の観察から世界へ広げる方法を重視しました。身近な場所をよく見る事から始めて、世界全体を理解する方法です。この姿勢は、今の探究学習にもつながる考えとして、大切にされています。"},
 {bookTitle:"創価教育学",chapterTitle:"戸田城聖の実践",text:"戸田城聖先生は、1900年に生まれ、牧口常三郎先生の弟子として教育と出版に取り組み、創価学会の二代会長となった方です。戦前、牧口先生と共に投獄されましたが、戦後に一人で学会の再建を始めました。教育者としては、数学の指導で『推理式指導算術』という本を著し、子供が公式を暗記するのではなく、なぜそうなるかを自分で推理して理解する方法を提案しました。暗算や生活の中での計算を大切にし、学ぶ事が楽しくなる工夫をしました。例えば、買い物の計算を自分の頭で考えるように教えました。また、生命についての深い考察を続け、生きる事の意味や、人間が持つ可能性について語りました。苦難の中でも希望を失わず、前向きに生きる力を育てる事が教育の役割だと考え、その実践を通して多くの人に勇気を与えました。"},
 {bookTitle:"創価教育学",chapterTitle:"池田大作の人間主義",text:"池田大作先生は、1928年に生まれ、戸田城聖先生の後を継いだ三代会長です。平和と文化と教育の分野で、世界に向けて多くの提言を行いました。国連への平和提言や、各国の大学や研究機関での講演を通して、対話による人間主義を訴えました。人と人が互いの違いを認め合い、話し合う事で争いを解決できると考えました。教育については、社会を変える中心は教育にあると位置づけました。学校だけでなく、家庭や地域を含めた広い学びの場が大切であり、一人一人が自分らしく成長できる環境を作る事が、平和な社会につながるとしました。子供だけでなく、大人も学び続ける事が大切だとしました。教育は競争のためではなく、皆が幸福になるためのものであるという考えを、世界中の人々との対話の中で実践しました。"},
 {bookTitle:"日蓮仏法",chapterTitle:"日蓮大聖人と法華経",text:"日蓮大聖人は、1222年に生まれ、鎌倉時代に法華経を根本とする教えを立てた僧です。法華経は、すべての人が仏になる可能性を持つと説く経典です。日蓮大聖人は、その教えの肝心を、南無妙法蓮華経という題目に込め、誰もが唱える事で仏の生命を開けるとしました。それまでの時代は、特定の人だけが救われるという考えもありましたが、日蓮大聖人は、身分や立場に関係なく、すべての人の成仏が開かれていると説きました。1253年に題目を唱え始め、法華経を社会の中で生かす道を示しました。苦しみの中にある人々を救いたいという願いから、厳しい弾圧や流罪の中でも教えを貫きました。その教えは、すべての人の生命の中に仏性があるという、平等と尊厳の思想につながっています。"},
 {bookTitle:"日蓮仏法",chapterTitle:"一念三千",text:"一念三千は、今の自分の心の一瞬の中に、三千の世界が備わっているという教えです。一念は今の心、三千は多くの世界を表す言葉です。天台大師智顗が、中国で法華経の教えを深めて説いたものです。人の心のあり方によって、世界が地獄のようにも、仏のようにも変わるという考えです。怒りや欲や愚かさに支配されれば苦しい世界になり、慈しみや智慧を持てば安らかな世界になります。この教えは、インドの釈迦に始まり、龍樹が大乗仏教として広め、智顗が体系化し、日本で日蓮大聖人が受け継ぎました。系譜は、釈迦、龍樹、智顗、日蓮と続きます。一念三千は、外の世界だけでなく、自分の心の中に世界を変える鍵がある事を教えます。今この瞬間の心を大切にする事が、人生を変える出発点になるという考えです。"},
 {bookTitle:"日蓮仏法",chapterTitle:"立正安国と平和",text:"立正安国は、正しい教えを立てる事で国が安らかになるという考えで、日蓮大聖人が著した『立正安国論』に説かれています。1260年、災害や争いが続く中で、当時の幕府に提出されました。社会の乱れの原因を、人々の心の中の迷いや対立にあると見て、正しい法に基づいた対話と変革が必要だと訴えました。ここでいう正しい教えとは、すべての人の尊厳を認め、共に生きる事を大切にする教えです。一人一人が自分自身を変える事を人間革命といい、その一人一人の変革が集まって、社会全体の平和につながると考えます。自分の心の変革から始めて、家族や地域へ広げていく事が、平和への道です。一人の変化が世界を変えるという考えは、今も多くの人に希望を与えています。"},
 {bookTitle:"生命の尊厳",chapterTitle:"非情の生命尊厳",text:"生命の尊厳は、人や動物だけにあるのではありません。植物や山や川や石や道具や建物や環境など、非情と呼ばれる存在にも及びます。すべての存在は、事実として存在しているという一点で、それ自体で尊厳を持っています。人は人にだけ価値があると考えがちですが、物もまた、その物として役割を持ち、つながりの中で生きています。花は花として咲き、石は石としてそこにあり、どちらも世界を成り立たせています。道具は人の暮らしを支え、環境はすべての生命を育みます。尊厳は、誰かが与えるものではなく、存在する事そのものに備わっているものです。このように考える事で、人だけでなく、すべての存在を大切にする心が生まれます。それが、本当の意味での生命の尊厳であり、平和の土台になります。"},
 {bookTitle:"生命の尊厳",chapterTitle:"事実相と平等",text:"すべてのものは、事実であるという一点で等しいという考えを、事実相といいます。仏法でいう諸法実相を、事実である姿そのものと捉える見方です。山も川も人も道具も、違いはあっても、事実として存在している事は同じです。この事実であるという平等から、尊厳と自由と平和が導かれます。誰もが事実として存在しているからこそ、等しく尊厳を持ち、自由に生きる事が許されます。差別は、この平等を否定する事です。他者を否定する事は、同じく事実として存在している自分自身の存在をも否定する事になります。自分を大切にする事と他者を大切にする事は、同じ事です。だからこそ、差別はしてはなりません。事実相に立つ事は、すべての存在を等しく大切にし、共に生きる社会を作る出発点になります。"},

 {bookTitle:"社会",chapterTitle:"昔の人々の暮らし",text:"昔は、電気や車がありませんでした。食べ物は、畑で育てたり、山や川で取ったりして用意しました。保存するために、干したり、漬けたり、塩をまぶしたりする工夫もしました。明かりは、ろうそくや油のランプを使いました。夜は早く休む事も多かったのです。移動は、歩いたり、馬や牛に荷物を運ばせたりしました。遠くへ行く時は、何日もかかりました。手紙を届けるのも大変でした。昔の人々は、自然と共に暮らし、季節に合わせて知恵を使って生活をしていました。その知恵は、今の暮らしにも生きています。"},
 {bookTitle:"社会",chapterTitle:"世界の国々",text:"世界には、約二百の国があります。国によって、話す言葉や食べ物や家の形が違います。例えば、暑い国では風通しの良い家に住み、寒い国では暖かい服を大切にします。祭りや音楽も国によって違います。どの国にも、人が集まって暮らす町の中心があります。その国で一番大切な決め事をする場所がある町を、首都といいます。日本では東京、アメリカではワシントン、フランスではパリが首都です。首都には、多くの人が働き、色々な国から人が集まります。首都を覚えると、世界の国々の事が少しずつ分かってきます。"},
 {bookTitle:"国語",chapterTitle:"物語の読み方",text:"物語を読む時は、主人公がどんな気持ちでいるかを考える事が大切です。うれしいのか、悲しいのか、困っているのか、言葉や行動から想像してみましょう。また、場面がどこからどこへ変わったかに注目すると、物語が分かりやすくなります。例えば、家の中から森の中へ変わると、何かが起こる合図かもしれません。朝から夜へ変わる事で、気持ちの変化を表す事もあります。場面の変わり目に線を引いてみると、物語の流れが見えてきます。最初と最後で気持ちがどう変わったかを比べると、物語の成長も分かります。"},
 {bookTitle:"国語",chapterTitle:"詩のリズム",text:"詩は、意味だけでなく、言葉のリズムを楽しむものです。声に出して読むと、言葉が音楽のように聞こえます。短い言葉を繰り返したり、同じ音をそろえたりする事で、心地よい響きが生まれます。例えば、こんな詩があります。『はるがきた はるがきた どこにきた やまにきた さとにきた のにもきた』同じ言葉が繰り返され、歩くようなリズムがあります。最後まで読むと、春がだんだん近づいてくる感じがします。自分でも、好きな言葉を並べて、口ずさむようにリズムを作ってみましょう。声に出す事が大切です。"},
 {bookTitle:"英語",chapterTitle:"英語のあいさつ",text:"英語でも、あいさつは大切です。おはようは Good morning ぐっどもーにんぐ、こんにちはは Hello はろー、こんばんはは Good evening ぐっどいーぶにんぐといいます。ありがとうは Thank you さんきゅー、どういたしましては You are welcome ゆーあーうぇるかむ、さようならは Goodbye ぐっどばいといいます。朝に Good morning と声をかけると、一日が気持ちよく始まります。相手の顔を見て、笑顔であいさつしてみましょう。あいさつは、世界のどこでも通じる、やさしい言葉です。"},
 {bookTitle:"英語",chapterTitle:"英語の数と色",text:"英語で数と色を覚えてみましょう。数は one わんが一、two つーが二、three すりーが三、four ふぉーが四、five ふぁいぶが五、six しっくすが六、seven せぶんが七、eight えいとが八、nine ないんが九、ten てんが十です。色は red れっどが赤、blue ぶるーが青、yellow いぇろーが黄色、green ぐりーんが緑、white ほわいとが白、black ぶらっくが黒です。りんごは red apple れっどあっぷる、青い空は blue sky ぶるーすかいのように、色と物を組み合わせて言ってみましょう。"},
 {bookTitle:"音楽",chapterTitle:"音階とリズム",text:"音楽は、音の高さと長さでできています。低い音から高い音へ、ドレミファソラシドという七つの音が順に並んだものを音階といいます。ドから始めて一つ上がるごとに音が高くなります。ドからドまで上がると、また同じドに戻りますが、少し高い音になります。次に、拍という考え方があります。音楽は一定のリズムで進み、一、二、三、四と手を叩いて数える事ができます。一拍ごとに手を叩き、二拍目を少し強く叩くと、歩くようなリズムになります。自分で手を叩きながら、ドレミを歌ってみましょう。"},
 {bookTitle:"生活",chapterTitle:"安全な暮らし",text:"安全に暮らすために、大切な事が三つあります。一つ目は交通安全です。道を渡る時は止まって、右と左と右をよく見て、車が来ない事を確かめます。信号が青でも、すぐに渡らず周りを見ましょう。二つ目は災害への備えです。地震の時は机の下に入り、揺れが収まるまで待ちます。大雨の時は川に近づかないようにします。三つ目は大人の言う事を聞く事です。危ない時は、大人が守ってくれます。分からない事があったら、一人で判断せず、必ず大人に相談しましょう。"}

function getAllParagraphs(){ return BUILTIN; }
function extractKeywords(text) {
  if (!text) return [];
  const cleaned = text.replace(/[！？。、「」『』（）()!?,.\n\r]/g, " ");
  const re = /[一-龠ぁ-んァ-ンー]{2,}|[A-Za-z0-9]{2,}/g;
  const raw = cleaned.match(re) || [];
  const split = cleaned.split(/\s+/).filter(w => w.length >= 2);
  const merged = [...raw, ...split];
  const stop = new Set(["とは","とは何","何ですか","ですか","です","ます","について","教えて","ください","とは何ですか","これ","それ","the","what","is","are","a","an","de","la","el","en","que","para","com","por"]);
  const uniq = [];
  const seen = new Set();
  for (let w of merged) {
    const k = w.toLowerCase().trim();
    if (k.length < 2) continue;
    if (stop.has(k)) continue;
    if (seen.has(k)) continue;
    seen.add(k);
    uniq.push(k);
    if (uniq.length >= 12) break;
  }
  // 日本語の文は単語に分かれないため、2文字の部分文字列も候補に加える
  const grams = [];
  for (let w of raw) {
    if (/^[一-龠ぁ-んァ-ンー]+$/.test(w) && w.length >= 3) {
      for (let i = 0; i + 2 <= w.length; i++) grams.push(w.slice(i, i + 2));
    }
  }
  for (let g of grams) {
    if (uniq.length >= 12) break;
    if (stop.has(g)) continue;
    if (seen.has(g)) continue;
    seen.add(g);
    uniq.push(g);
  }
  return uniq;
}
function searchParagraphs(keywords) {
  if (!keywords || keywords.length === 0) return [];
  const all = getAllParagraphs();
  // キーワードが何段落に現れるか（多い物は一般的すぎるので重みを下げる）
  const df = {};
  for (let kw of keywords) {
    df[kw] = 0;
    for (let item of all) { if (item.text.toLowerCase().includes(kw)) df[kw]++; }
  }
  const weight = kw => { const d = df[kw] || 99; return d <= 1 ? 3 : d === 2 ? 2 : d === 3 ? 1 : 0.2; };
  const results = [];
  for (let i = 0; i < all.length; i++) {
    const item = all[i];
    const lower = item.text.toLowerCase();
    let score = 0;
    const matched = [];
    for (let kw of keywords) {
      if (lower.includes(kw)) { score += weight(kw); matched.push(kw); }
    }
    if (score >= 1.5) {
      results.push({ bookTitle: item.bookTitle, chapterTitle: item.chapterTitle, text: item.text, matchedKeywords: matched, score: score, sourceLabel: "出典：" + item.bookTitle + " " + item.chapterTitle });
    }
  }
  results.sort((a, b) => b.score - a.score);
  return results.slice(0, 3);
}

  let hits = searchParagraphs(keywords);
  // 章の題名がそのまま質問に含まれていれば、その段落を先頭にする
  const titleHit = BUILTIN.find(b => q.includes(b.chapterTitle));
  if (titleHit) {
    hits = hits.filter(h => h.chapterTitle !== titleHit.chapterTitle);
    hits.unshift({ bookTitle: titleHit.bookTitle, chapterTitle: titleHit.chapterTitle, text: titleHit.text, matchedKeywords: [titleHit.chapterTitle], score: 99, sourceLabel: "出典：" + titleHit.bookTitle + " " + titleHit.chapterTitle });
  }
  if (hits.length > 0) {
    aEl.innerHTML = "";
    hits.forEach(h => {
      const div = document.createElement("div");
      div.className = "hit";
      const p = document.createElement("div");
      p.textContent = h.text;
      const src = document.createElement("div");
      src.className = "src";
      src.textContent = h.sourceLabel + "（" + t.builtinSrc + "）";
      div.appendChild(p);
      div.appendChild(src);
      aEl.appendChild(div);
    });
    const topHit = hits[0];
    const sibIdx = BUILTIN.findIndex(b => b.bookTitle === topHit.bookTitle && b.chapterTitle !== topHit.chapterTitle && !hits.some(h => h.chapterTitle === b.chapterTitle));
    if (sibIdx >= 0) {
      const tut = document.createElement("div");
      tut.className = "src";
      tut.textContent = "先生から：次は、同じ" + topHit.bookTitle + "の『" + BUILTIN[sibIdx].chapterTitle + "』も読んでみましょう。";
      const btn = document.createElement("button");
      btn.className = "bookBtn";
      btn.textContent = BUILTIN[sibIdx].chapterTitle + "を読む";
      btn.onclick = () => showParagraph(sibIdx);
      tut.appendChild(document.createElement("br"));
      tut.appendChild(btn);
      aEl.appendChild(tut);
    }
    return;
  }
  aEl.textContent = t.searching;
  const wl = wikiLang(curLang);
  const url = "https://" + wl + ".wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=" + encodeURIComponent(q) + "&gsrlimit=3&prop=extracts&exintro&explaintext&format=json&origin=*";
  try {
    const r = await fetch(url);
    const j = await r.json();
    const pages = j && j.query && j.query.pages ? Object.values(j.query.pages) : [];
    pages.sort((a,b) => (a.index||0) - (b.index||0));
    const withText = pages.filter(p => p.extract && p.extract.trim().length > 0);
    if (withText.length === 0) { aEl.textContent = t.notFound; return; }
    aEl.innerHTML = "";
    withText.forEach(p => {
      const div = document.createElement("div");
      div.className = "hit";
      const body = document.createElement("div");
      body.textContent = p.extract.length > 500 ? p.extract.slice(0, 500) + "…" : p.extract;
      const src = document.createElement("div");
      src.className = "src";
      const a = document.createElement("a");
      a.href = "https://" + wl + ".wikipedia.org/wiki/" + encodeURIComponent(p.title);
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "出典：Wikipedia「" + p.title + "」";
      src.appendChild(a);
      div.appendChild(body);
      div.appendChild(src);
      aEl.appendChild(div);
    });
    const tut2 = document.createElement("div");
    tut2.className = "src";
    tut2.textContent = "先生から：分からない言葉があったら、その言葉でもう一度質問してみましょう。";
    aEl.appendChild(tut2);
  } catch (e) {
    aEl.textContent = t.notFound;
  }
}

function fieldShow(title, extract, url) {
  const aEl = document.getElementById("answerBox");
  aEl.innerHTML = "";
  const h = document.createElement("div");
  h.style.fontWeight = "700";
  h.textContent = title;

function fieldNotFound() {
  const aEl = document.getElementById("answerBox");
  aEl.textContent = langPack(curLang).notFound;
}
function fetchSummary(wl, title) {
  return fetch("https://" + wl + ".wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(title))
    .then(r => { if (!r.ok) throw new Error("not ok"); return r.json(); });
}
function readField(idx) {
  const f = HARUKA_FIELDS[idx];
  if (!f) return;
  const wl = wikiLang(curLang);
  const aEl = document.getElementById("answerBox");
  aEl.textContent = langPack(curLang).searching;
  const titles = [f.name].concat(f.keywords);
  function tryJaTitles(list) {
    if (!list.length) { fieldNotFound(); return; }
    fetchSummary(wl, list[0])
      .then(d => fieldShow(d.title || list[0], d.extract || "", (d.content_urls && d.content_urls.desktop && d.content_urls.desktop.page) || ("https://" + wl + ".wikipedia.org/wiki/" + encodeURIComponent(list[0]))))
      .catch(() => tryJaTitles(list.slice(1)));
  }
  if (wl === "ja") { tryJaTitles(titles); return; }
  // 他の言語：まず日本語版の記事から、その言語版の題名（言語間リンク）をたどる
  fetch("https://ja.wikipedia.org/w/api.php?action=query&prop=langlinks&lllang=" + encodeURIComponent(wl) + "&titles=" + encodeURIComponent(f.name) + "&format=json&origin=*")
    .then(r => r.json())
    .then(d => {
      const pages = d && d.query && d.query.pages ? Object.values(d.query.pages) : [];
      const ll = pages.length && pages[0].langlinks && pages[0].langlinks.length ? pages[0].langlinks[0]["*"] : null;
      if (ll) {
        fetchSummary(wl, ll)
          .then(dd => fieldShow(dd.title || ll, dd.extract || "", (dd.content_urls && dd.content_urls.desktop && dd.content_urls.desktop.page) || ("https://" + wl + ".wikipedia.org/wiki/" + encodeURIComponent(ll))))
          .catch(() => fieldNotFound());
      } else {
        fieldNotFound();
      }
    })
    .catch(() => fieldNotFound());
}

function noteVoiceMissing(lang) {
  try {
    if (!("speechSynthesis" in window) || !window.pickVoiceForLang || !window.getVoiceMissingMessage) return;
    const vs = window.speechSynthesis.getVoices();
    if (vs && vs.length > 0 && !window.pickVoiceForLang(lang)) {
      const el = document.getElementById("statusText");
      const orig = langPack(curLang).statusText;
      el.textContent = window.getVoiceMissingMessage(lang);
      setTimeout(() => { el.textContent = orig; }, 5000);
    }
  } catch (e) {}
}
function speakLecture(i, btn) {
  const p = BUILTIN[i];
  if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined") return;
  const lang = voiceCompLang();
  noteVoiceMissing(lang);
  const f = LECTURE_FRAME[curLang] || LECTURE_FRAME.en;
  if (btn) btn.textContent = "講義を止める";
  window.startLecture(p.chapterTitle, p.text, {
    lang: lang,
    intro: f.intro(p.bookTitle, p.chapterTitle),
    closing: f.closing,
    onEnd: () => { if (btn) btn.textContent = "講義を聞く"; }
  });
}
