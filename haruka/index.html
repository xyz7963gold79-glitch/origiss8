<body>

    <div id="bookList" style="display:none"></div>

    <h2 id="aHeading">解答</h2>

    <p><a href="https://youtu.be/NsECaMXrM4w" target="_blank" rel="noopener">作った作品：第8話「手紙の届かない星の少女」</a></p>
  </div>

  <footer>
    <p><a href="https://xyz7963gold79-glitch.github.io/origiss8/">元のハルカ教育AI v42（テンプレート型）はこちら</a></p>
    <p>制作：女子会</p>
  </footer>
</div>

let curLang = "ja";
function langPack(code){
  if (UI_DICT[code]) return UI_DICT[code];
  const base = (code||"").split("-")[0];
  return UI_DICT[base] || UI_DICT.en;
}
function wikiLang(code){
  if (code === "zh-CN" || code === "zh") return "zh";
  if (code === "pt-BR") return "pt";
  return (code||"ja").split("-")[0];
}
function applyLang(code){
  curLang = UI_DICT[code] ? code : ((code||"").split("-")[0] in UI_DICT ? (code||"").split("-")[0] : "en");
  if (curLang === "zh") curLang = "zh-CN";
  const t = langPack(curLang);
  document.getElementById("appTitle").textContent = t.appTitle;
  document.getElementById("libraryHeading").textContent = t.libraryHeading;
  document.getElementById("qHeading").textContent = t.qHeading;
  document.getElementById("aHeading").textContent = t.aHeading;
  document.getElementById("sendBtn").textContent = t.sendBtn;
  document.getElementById("statusText").textContent = t.statusText;
  document.getElementById("bodyNote").textContent = t.bodyNote;
  document.getElementById("questionBox").placeholder = t.placeholder;
  window.currentLang = curLang;
}

 {bookTitle:"理科",chapterTitle:"光合成",text:"光合成とは、植物が太陽の光と水と空気中の二酸化炭素を使って、自分の栄養（でんぷん）を作る働きです。この時、酸素が空気中へ出ます。人や動物が吸う酸素は、植物の光合成から来ています。"},
 {bookTitle:"理科",chapterTitle:"地球の自転と昼と夜",text:"地球は、北極と南極を結ぶ軸を中心に、1日に1回、自分で回っています。これを自転といいます。太陽の光が当たっている所が昼、反対側が夜になり、自転のため昼と夜が繰り返します。"},

 {bookTitle:"理科",chapterTitle:"虹",text:"虹は、雨上がりに空中の小さな水滴の中で太陽の光が分かれて、色の帯になって見えるものです。太陽と反対側の空に、雨と太陽光がある時に見えます。"},
 {bookTitle:"算数",chapterTitle:"分数",text:"分数は、1つのものを同じ大きさに分けたうちの、いくつ分かを表す数です。例えば1/2は、1つを2つに分けた1つ分です。下の数を分母、上の数を分子といいます。ピザやケーキを分ける時に使います。"},

 {bookTitle:"社会",chapterTitle:"信濃川",text:"信濃川は、長野県から新潟県へ流れて日本海に注ぐ、長さ約367kmの、日本で一番長い川です。長野県では千曲川と呼ばれます。流域の人々の暮らしと、田畑を支えてきました。"},
 {bookTitle:"理科",chapterTitle:"水の姿の変化",text:"水は、温度によって姿を変えます。0度以下では氷という固体になり、温めると溶けて液体の水に戻ります。もっと熱すると、100度で沸騰して、水蒸気という目に見えない気体になります。水蒸気が冷えると、また小さな水の粒に戻ります。固体・液体・気体の3つの姿を行き来するのが、水の性質です。"},
 {bookTitle:"理科",chapterTitle:"太陽と惑星",text:"太陽は、自分で光を出す星（恒星）です。その周りを、水星・金星・地球・火星・木星・土星・天王星・海王星の8つの惑星が回っています。惑星は自分では光らず、太陽の光を反射して光って見えます。地球は太陽から3番目の惑星で、太陽の周りを1年かけて1周します。"},
 {bookTitle:"理科",chapterTitle:"植物の一生",text:"植物は、種から始まります。種が水と温かさを得ると芽を出し（発芽）、根と茎と葉を伸ばして育ちます。やがて花を咲かせ、めしべが花粉を受けると（受粉）、実の中に新しい種ができます。種が落ちて、また芽を出す。この繰り返しが、植物の一生のめぐりです。"},

 {bookTitle:"算数",chapterTitle:"かけ算",text:"かけ算は、同じ数を何回も足していく計算を、短く表したものです。たとえば、りんごが3こずつ入った箱が4箱あるとき、全部の数は3+3+3+3で求められますが、かけ算では3×4=12と書けます。九九を覚えると速く計算でき、順番を入れかえても答えは同じです。"},
 {bookTitle:"算数",chapterTitle:"わり算",text:"わり算は、数を同じ大きさに分けたり、いくつに分けられるかを調べる計算です。たとえば、クッキー12まいを3人で同じ数ずつ分けると、12÷3=4で、1人4まいになります。また、1つの大きさが分かっているときに、全体からその数を何回取れるかを調べるのにも使います。"},
 {bookTitle:"算数",chapterTitle:"三角形と四角形",text:"三角形は、3本の直線で囲まれた形で、角は3つあります。四角形は、4本の直線で囲まれた形で、角は4つあります。たとえば、道路の標識には三角形のものがあり、ノートや本は四角形です。辺の長さや角の大きさによって、正三角形や正方形など、いろいろな形に分かれます。"},
 {bookTitle:"算数",chapterTitle:"長さの単位",text:"長さを表す単位には、ミリメートル（mm）、センチメートル（cm）、メートル（m）、キロメートル（km）があります。1cmは10mm、1mは100cm、1kmは1000mです。たとえば、えんぴつの長さはcmで、学校までの道のりはkmで表すと便利です。"},
 {bookTitle:"社会",chapterTitle:"日本列島",text:"日本列島は、北海道・本州・四国・九州の4つの大きな島と、たくさんの小さな島からできています。北から南まで細長く伸びていて、長さは約3,000kmあります。山が多い国で、平地は少なく、人々は海の近くや平野に集まって暮らしています。四季があり、地域によって気候が大きく違います。"},
 {bookTitle:"社会",chapterTitle:"米づくり",text:"米づくりは、春に種をまいて苗を作り、水を入れた田んぼ（水田）に植えることから始まります。夏は水の量や温度に気をつけて育て、秋に実った稲を刈り取ります。日本の主食である米は、昔から多くの人の手間と工夫によって作られてきました。雨や雪の水をためる山や川も、大切な役割をしています。"},
 {bookTitle:"国語",chapterTitle:"主語と述語",text:"主語と述語は、文の中心になる組み合わせです。主語は「何が・誰が」にあたる部分で、述語は「どうする・どんなだ・何だ」にあたる部分です。例えば「犬が走る」では、「犬が」が主語、「走る」が述語です。この2つが合えば、短くても文が成り立ちます。"},
 {bookTitle:"国語",chapterTitle:"漢字の成り立ち",text:"漢字は、物の形や様子をもとに作られた文字です。例えば「山」は山の形、「川」は水の流れの様子を表しています。形をそのまま表した文字のほかに、意味を組み合わせた文字や、音を表す部分を持つ文字もあります。漢字は中国で生まれ、日本に伝わって、ひらがなやカタカナと一緒に使われています。"},
 {bookTitle:"理科",chapterTitle:"細胞",text:"生物の体は細胞という小さな部屋が集まってできています。ヒトの体には約37兆個の細胞があります。細胞の中心には核があり、遺伝情報が入っています。核のまわりは細胞質で、エネルギーを作るミトコンドリアなどが浮かんでいます。一番外側は細胞膜で中身を守ります。植物の細胞にはさらに細胞壁、葉緑体、大きな液胞があります。例えば、玉ねぎの薄い皮を顕微鏡で見ると、四角い細胞がきれいに並んでいるのがわかります。葉緑体は光合成をして養分を作る場所です。このように構造を知ると、生物がどう生きているか理解しやすくなります。"},
 {bookTitle:"理科",chapterTitle:"化学変化",text:"化学変化は、物質が別の物質に変わる変化です。形が変わるだけの物理変化と違い、性質が全く違うものになります。例えば、紙を燃やすと灰になり、もとに戻りません。鉄がさびるのも化学変化で、鉄と空気中の酸素と水が結びついて酸化鉄ができます。化学変化では原子の組み合わせが変わりますが、原子の種類や数は変わりません。反応式では、2H2+O2→2H2Oのように表します。この式は、水素と酸素から水ができることを示しています。身近な例では、重曹と酢を混ぜると二酸化炭素が発生して泡が出ます。この泡の正体を確かめる実験が、中学校の理科でよく行われます。"},
 {bookTitle:"理科",chapterTitle:"電流",text:"電流は電気の流れで、電子という小さな粒が導線の中を動くことで起こります。電流の単位はアンペア（A）で、1秒間に流れる電気の量を表します。電流を流すには、乾電池のような電圧が必要です。電圧は電気を押し出す力で、単位はボルト（V）です。電流の流れにくさは抵抗といい、オーム（Ω）で表します。電圧、電流、抵抗の関係はオームの法則V=IRで表せます。例えば、3Vの電池に6Ωの豆電球をつなぐと、0.5Aの電流が流れます。回路は途切れると電流が止まるので、スイッチで入り切りできます。"},
 {bookTitle:"理科",chapterTitle:"天気の変化",text:"天気は空気の動きで変わります。空気が上空で冷えると雲ができ、雨が降ります。気圧は空気の重さで、気圧が高い所を高気圧、低い所を低気圧といいます。低気圧では空気が上昇して雲ができやすいので雨になりやすく、高気圧では晴れやすいです。寒気と暖気がぶつかると前線ができ、前線の近くでも雨が降ります。天気図では等圧線で気圧を表し、風は高気圧から低気圧へ吹きます。例えば、春に日本海に低気圧があると、南から暖かい風が入り気温が上がります。毎日の天気予報は、こうしたデータを集めて作られています。"},
 {bookTitle:"数学",chapterTitle:"負の数",text:"負の数は0より小さい数で、−の記号を付けて表します。例えば−3はマイナス3と読みます。数直線では0の左側に負の数、右側に正の数があります。負の数は気温や借金など、基準より下がることを表すのに便利です。計算では、5+(-3)=2のように、負の数を足すと引き算になります。5-(-3)=8のように、負の数を引くと足し算になります。掛け算では、負×負は正になります。例えば、−2×−3=6です。これは、反対の反対は賛成という考え方に似ています。0は正でも負でもありません。"},
 {bookTitle:"数学",chapterTitle:"一次方程式",text:"一次方程式は、xのような文字を含み、xの次数が1である方程式です。例えば2x+3=11は一次方程式です。これを解くとは、等式を成り立たせるxの値を見つけることです。等式の性質を使い、両辺に同じ数を足したり引いたり、掛けたり割ったりしても等式は保たれます。2x+3=11では、両辺から3を引いて2x=8、両辺を2で割ってx=4となります。検算としてx=4を元に戻すと2×4+3=11で正しいと確認できます。一次方程式は、買い物の代金や速さの問題など、身近な数量の関係を解くのに役立ちます。"},
 {bookTitle:"数学",chapterTitle:"比例と反比例",text:"比例は、一方が2倍、3倍になると、もう一方も2倍、3倍になる関係です。式ではy=ax（aは比例定数）で表します。例えば、1個100円のりんごでは、個数をx、代金をyとするとy=100xで比例します。グラフは原点を通る直線です。反比例は、一方が2倍になるともう一方が1/2倍になる関係で、式はy=a/xです。例えば、面積が12cm2の長方形で、縦をxcm、横をycmとするとy=12/xで反比例です。速さが一定のとき、距離と時間は比例し、距離が一定のとき、速さと時間は反比例します。グラフは双曲線になります。"},
 {bookTitle:"数学",chapterTitle:"確率",text:"確率は、あることがらが起こる起こりやすさを数で表したものです。0から1の間の数で表し、0は絶対起こらず、1は必ず起こります。例えば、1個のサイコロを投げて1の目が出る確率は、全部で6通りあるうちの1通りなので1/6です。2個のサイコロで目の和が7になる場合を考えると、全部で36通りのうち(1,6)(2,5)(3,4)(4,3)(5,2)(6,1)の6通りなので、確率は6/36=1/6です。確率は、くじや天気予報、病気の検査など、生活のさまざまな場面で使われています。すべての場合を正しく数えることが大切です。"},
 {"bookTitle":"つくる","chapterTitle":"アニメを作る道具","text":"アニメは、物語を書く脚本、絵、声、音楽、字幕を合わせて作ります。『星海鉄道カプセル便』は、無料で公開されている道具（seihai-tool）で作られています。この道具は、脚本づくりから場面の組み立て、字幕、声の割り当てまでを助けます。道具はGitHubで、誰でも無料で使えます。物語を考えるのは人間の仕事で、道具はそれを形にする手伝いをします。自分の物語をアニメにする事は、勉強の先にある楽しみの一つです。"}

function getAllParagraphs(){ return BUILTIN; }
function extractKeywords(text) {
  if (!text) return [];
  const cleaned = text.replace(/[！？。、「」『』（）()!?,.\n\r]/g, " ");
  const re = /[一-龠ぁ-んァ-ンー]{2,}|[A-Za-z0-9]{2,}/g;
  const raw = cleaned.match(re) || [];
  const split = cleaned.split(/\s+/).filter(w => w.length >= 2);
  const merged = [...raw, ...split];
  const stop = new Set(["とは","とは何","何ですか","ですか","です","ます","について","教えて","ください","とは何ですか","これ","それ","the","what","is","are","a","an","de","la","el","en","que","para","com","por"]);
  const uniq = [];
  const seen = new Set();
  for (let w of merged) {
    const k = w.toLowerCase().trim();
    if (k.length < 2) continue;
    if (stop.has(k)) continue;
    if (seen.has(k)) continue;
    seen.add(k);
    uniq.push(k);
    if (uniq.length >= 12) break;
  }
  // 日本語の文は単語に分かれないため、2文字の部分文字列も候補に加える
  const grams = [];
  for (let w of raw) {
    if (/^[一-龠ぁ-んァ-ンー]+$/.test(w) && w.length >= 3) {
      for (let i = 0; i + 2 <= w.length; i++) grams.push(w.slice(i, i + 2));
    }
  }
  for (let g of grams) {
    if (uniq.length >= 12) break;
    if (stop.has(g)) continue;
    if (seen.has(g)) continue;
    seen.add(g);
    uniq.push(g);
  }
  return uniq;
}
function searchParagraphs(keywords) {
  if (!keywords || keywords.length === 0) return [];
  const all = getAllParagraphs();
  // キーワードが何段落に現れるか（多い物は一般的すぎるので重みを下げる）
  const df = {};
  for (let kw of keywords) {
    df[kw] = 0;
    for (let item of all) { if (item.text.toLowerCase().includes(kw)) df[kw]++; }
  }
  const weight = kw => { const d = df[kw] || 99; return d <= 1 ? 3 : d === 2 ? 2 : d === 3 ? 1 : 0.2; };
  const results = [];
  for (let i = 0; i < all.length; i++) {
    const item = all[i];
    const lower = item.text.toLowerCase();
    let score = 0;
    const matched = [];
    for (let kw of keywords) {
      if (lower.includes(kw)) { score += weight(kw); matched.push(kw); }
    }
    if (score >= 1.5) {
      results.push({ bookTitle: item.bookTitle, chapterTitle: item.chapterTitle, text: item.text, matchedKeywords: matched, score: score, sourceLabel: "出典：" + item.bookTitle + " " + item.chapterTitle });
    }
  }
  results.sort((a, b) => b.score - a.score);
  return results.slice(0, 3);
}
async function doSearch() {
  const qEl = document.getElementById("questionBox");
  const aEl = document.getElementById("answerBox");
  const t = langPack(curLang);
  const q = qEl.value.trim();
  if (!q) return;
  const keywords = extractKeywords(q);
  let hits = searchParagraphs(keywords);
  // 章の題名がそのまま質問に含まれていれば、その段落を先頭にする
  const titleHit = BUILTIN.find(b => q.includes(b.chapterTitle));
  if (titleHit) {
    hits = hits.filter(h => h.chapterTitle !== titleHit.chapterTitle);
    hits.unshift({ bookTitle: titleHit.bookTitle, chapterTitle: titleHit.chapterTitle, text: titleHit.text, matchedKeywords: [titleHit.chapterTitle], score: 99, sourceLabel: "出典：" + titleHit.bookTitle + " " + titleHit.chapterTitle });
  }
  if (hits.length > 0) {
    aEl.innerHTML = "";
    hits.forEach(h => {
      const div = document.createElement("div");
      div.className = "hit";
      const p = document.createElement("div");
      p.textContent = h.text;
      const src = document.createElement("div");
      src.className = "src";
      src.textContent = h.sourceLabel + "（" + t.builtinSrc + "）";
      div.appendChild(p);
      div.appendChild(src);
      aEl.appendChild(div);
    });
    return;
  }
  aEl.textContent = t.searching;
  const wl = wikiLang(curLang);
  const url = "https://" + wl + ".wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=" + encodeURIComponent(q) + "&gsrlimit=3&prop=extracts&exintro&explaintext&format=json&origin=*";
  try {
    const r = await fetch(url);
    const j = await r.json();
    const pages = j && j.query && j.query.pages ? Object.values(j.query.pages) : [];
    pages.sort((a,b) => (a.index||0) - (b.index||0));
    const withText = pages.filter(p => p.extract && p.extract.trim().length > 0);
    if (withText.length === 0) { aEl.textContent = t.notFound; return; }
    aEl.innerHTML = "";
    withText.forEach(p => {
      const div = document.createElement("div");
      div.className = "hit";
      const body = document.createElement("div");
      body.textContent = p.extract.length > 500 ? p.extract.slice(0, 500) + "…" : p.extract;
      const src = document.createElement("div");
      src.className = "src";
      const a = document.createElement("a");
      a.href = "https://" + wl + ".wikipedia.org/wiki/" + encodeURIComponent(p.title);
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "出典：Wikipedia「" + p.title + "」";
      src.appendChild(a);
      div.appendChild(body);
      div.appendChild(src);
      aEl.appendChild(div);
    });
  } catch (e) {
    aEl.textContent = t.notFound;
  }
}

function renderBooks() {
  const el = document.getElementById("bookList");
  const groups = {};
  BUILTIN.forEach((p, i) => { (groups[p.bookTitle] = groups[p.bookTitle] || []).push(i); });
  el.innerHTML = Object.keys(groups).map(book =>
    "<h3>" + book + "</h3>" + groups[book].map(i =>
      '<button class="bookBtn" onclick="showParagraph(' + i + ')">' + BUILTIN[i].chapterTitle + "</button>").join("")
  ).join("");
}
function showParagraph(i) {
  const p = BUILTIN[i];
  const aEl = document.getElementById("answerBox");
  aEl.innerHTML = "";
  aEl.appendChild(document.createTextNode(p.text));
  const src = document.createElement("div");
  src.className = "src";
  src.textContent = "出典：内蔵教科書 " + p.bookTitle + "「" + p.chapterTitle + "」";
  aEl.appendChild(src);
  if (aEl.scrollIntoView) aEl.scrollIntoView({behavior:"smooth", block:"start"});
}
function toggleBooks() {
  const el = document.getElementById("bookList");
  if (el.style.display === "none") { renderBooks(); el.style.display = "block"; }
  else { el.style.display = "none"; }
}
function toggleFont() {
  const aEl = document.getElementById("answerBox");
  aEl.classList.toggle("big");
  document.getElementById("fontBtn").textContent = aEl.classList.contains("big") ? "文字をもどす" : "文字を大きく";
}
